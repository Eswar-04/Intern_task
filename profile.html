<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | Nexus Auth</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <meta name="description" content="View and edit your personal profile details.">
</head>
<body>
    <div class="profile-container auth-card shadow-lg">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 border-bottom border-secondary pb-3 gap-3">
            <h2 class="mb-0">Your Profile</h2>
            <button id="btnLogout" class="btn btn-outline-danger px-4" style="border-radius: 10px; font-weight: 500;">Logout</button>
        </div>

        <div id="profileAlert" class="alert alert-custom text-center mb-4" role="alert"></div>
        
        <!-- Loading state initially -->
        <div id="profileLoading" class="text-center py-5">
            <div class="spinner-border text-primary" style="width: 3rem; height: 3rem; display: inline-block" role="status"></div>
            <p class="mt-3 text-muted">Loading profile data...</p>
        </div>

        <div id="profileContent" style="display: none;">
            <div class="row align-items-center">
                <div class="col-md-4 text-center border-end border-secondary border-opacity-25 pb-4 pb-md-0">
                    <div class="avatar-circle" id="userInitial">U</div>
                    <h4 id="displayRoleName" class="mb-1 text-white">User Name</h4>
                    <p id="displayEmail" class="text-muted mb-3">user@example.com</p>
                    <span class="badge bg-success bg-opacity-25 text-success border border-success border-opacity-50 px-3 py-2 rounded-pill shadow-sm">Active Member</span>
                </div>
                <div class="col-md-8 ps-md-4 pt-4 pt-md-0">
                    <form id="profileForm">
                        <h5 class="mb-4 text-white" style="font-weight: 600;">Personal Details</h5>
                        <div class="row">
                            <div class="col-sm-6 mb-4">
                                <label for="age" class="form-label">Age</label>
                                <input type="number" class="form-control" id="age" name="age" placeholder="e.g. 25" min="1" max="150" required>
                            </div>
                            <div class="col-sm-6 mb-4">
                                <label for="dob" class="form-label">Date of Birth</label>
                                <input type="date" class="form-control" id="dob" name="dob" required>
                            </div>
                            <div class="col-12 mb-5">
                                <label for="contact" class="form-label">Contact Number</label>
                                <input type="tel" class="form-control" id="contact" name="contact" placeholder="+1 (555) 000-0000" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100" id="btnSaveProfile">
                            <span class="btn-text">Save Changes</span>
                            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="assets/js/profile.js"></script>
</body>
</html>
