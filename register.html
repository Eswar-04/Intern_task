<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Nexus Auth</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <meta name="description" content="Register a new Nexus account.">
</head>
<body>
    <div class="auth-card">
        <div class="text-center mb-4">
            <h2>Create Account</h2>
            <p class="subtitle">Join Nexus to set up your profile</p>
        </div>
        
        <div id="registerAlert" class="alert alert-custom text-center mb-4" role="alert"></div>

        <form id="registerForm">
            <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="name" name="name" placeholder="John Doe" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required minlength="6">
            </div>
            
            <button type="submit" class="btn btn-primary" id="btnRegister">
                <span class="btn-text">Sign Up</span>
                <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
            </button>
        </form>
        
        <div class="text-center mt-4">
            <p class="text-muted mb-0">Already have an account? <a href="login.html" class="custom-link">Log in</a></p>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="assets/js/register.js"></script>
</body>
</html>
