<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | Nexus Auth</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <meta name="description" content="Welcome to Nexus Auth. A secure internal authorization and profile management platform.">
</head>
<body>
    <div class="auth-card text-center">
        <div class="mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="url(#grad1)" class="bi bi-hexagon-fill" viewBox="0 0 16 16">
                <defs>
                    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
                    </linearGradient>
                </defs>
                <path fill-rule="evenodd" d="M8.5.134a1 1 0 0 0-1 0l-6 3.577a1 1 0 0 0-.5.866v6.846a1 1 0 0 0 .5.866l6 3.577a1 1 0 0 0 1 0l6-3.577a1 1 0 0 0 .5-.866V4.577a1 1 0 0 0-.5-.866z"/>
            </svg>
        </div>
        <h2>Welcome to Nexus</h2>
        <p class="subtitle">Experience the future of seamless authentication.</p>
        
        <div class="d-flex flex-column gap-3 mt-4">
            <a href="login.html" class="btn btn-primary py-3">Sign In</a>
            <a href="register.html" class="btn btn-outline-light py-3 border-secondary text-white" style="border-radius: 12px; transition: all 0.3s ease;">Create an Account</a>
        </div>
    </div>

    <!-- Redirect logic if already logged in -->
    <script>
        if(localStorage.getItem('session_token')) {
            window.location.href = 'profile.html';
        }
    </script>
</body>
</html>
