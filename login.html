<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Nexus Auth</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <meta name="description" content="Sign in to your Nexus account.">
</head>
<body>
    <div class="auth-card">
        <div class="text-center mb-4">
            <h2>Welcome Back</h2>
            <p class="subtitle">Sign in to your Nexus account</p>
        </div>
        
        <div id="loginAlert" class="alert alert-custom text-center mb-4" role="alert"></div>

        <form id="loginForm">
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
            </div>
            <div class="mb-4">
                <div class="d-flex justify-content-between">
                    <label for="password" class="form-label">Password</label>
                    <a href="#" class="custom-link" style="font-size: 0.85rem;">Forgot password?</a>
                </div>
                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn btn-primary" id="btnLogin">
                <span class="btn-text">Sign In</span>
                <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
            </button>
        </form>
        
        <div class="text-center mt-4">
            <p class="text-muted mb-0">Don't have an account? <a href="register.html" class="custom-link">Sign up</a></p>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="assets/js/login.js"></script>
</body>
</html>
